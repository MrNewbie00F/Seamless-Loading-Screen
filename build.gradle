plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "net.fabricmc.fabric-loom"

    loom {
        // 26.1+ is unobfuscated, so no Yarn/Mojang mapping license handling needed here.
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        // IMPORTANT:
        // No mappings line for Minecraft 26.1+
        // No Yarn mappings
        // No yarn-mappings-patch-neoforge
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://maven.quiltmc.org/repository/release" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }

        maven {
            name = "Modrinth"
            url "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }

        maven { url "https://maven.isxander.dev/releases" }
        maven { url "https://jitpack.io" }

        maven {
            name = "Ladysnake Libs"
            url = "https://maven.ladysnake.org/releases"
        }

        maven {
            url = "https://maven.cafeteria.dev"
            content {
                includeGroup "net.adriantodt.fabricmc"
            }
        }

        maven {
            url "https://maven.jamieswhiteshirt.com/libs-release"
            content {
                includeGroup "com.jamieswhiteshirt"
            }
        }

        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
    }
}
