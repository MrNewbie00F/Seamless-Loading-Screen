architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/seamless_loading_screen.accesswidener")
}

dependencies {
    // Used only for @Environment annotations and mixin-related compile classes.
    // Do not use Fabric Loader runtime classes from common code.
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Your gradle.properties yacl_version already includes "-fabric",
    // so do NOT add "-fabric" again here.
    compileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
