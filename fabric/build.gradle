architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        client_mixin {
            client()
            ideConfigGenerated true
            name = "[${project.archivesBaseName}] Client - (Mixin Swap)"
            source sourceSets.main
            vmArg "-Dmixin.debug.export=true"

            try {
                afterEvaluate {
                    def mixinDep = this.configurations.compileClasspath
                            .allDependencies
                            .findAll { it.name == "sponge-mixin" }
                            .first()

                    if (mixinDep != null) {
                        def mixinPath = this.configurations.compileClasspath.files(mixinDep).first().path
                        println(mixinPath)
                        vmArg("-javaagent:\"${mixinPath}\"")
                        println("[Info]: Mixin Hotswap Run should be working")
                    } else {
                        println("[Warning]: Unable to locate file path for Mixin Jar, HotSwap Run will not work!!!")
                    }
                }
            } catch (Exception e) {
                println("[Error]: MixinHotswap Run had a issue!")
                e.printStackTrace()
            }
        }
    }
}

configurations {
    common
    shadowCommon

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude module: "fabric-api"
    }

    implementation("dev.isxander:yet-another-config-lib:${rootProject.yacl_version}") {
        exclude module: "fabric-api"
    }

    // IMPORTANT:
    // Bedrockify 1.10.1+mc1.21 is too old for Minecraft 26.1.x.
    // Leave this commented out unless you find a 26.1-compatible Bedrockify build.
    // compileOnly("maven.modrinth:bedrockify:${rootProject.bedrockify_version}")

    common(project(path: ":common", configuration: "namedElements")) {
        transitive false
    }

    shadowCommon(project(path: ":common", configuration: "namedElements")) {
        transitive false
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveClassifier.set "fabric"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude "architectury.common.json"

    from {
        configurations.shadowCommon.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
